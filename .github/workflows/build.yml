# .github/workflows/build.yml
name: Build Windows EXE

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Upgrade pip to latest
      run: |
        python -m pip install --upgrade pip setuptools wheel

    - name: Install PyTorch (pinned, fast)
      run: |
        pip install torch==2.1.0 torchvision==0.16.0 --index-url https://download.pytorch.org/whl/cu118
    
    - name: Install remaining dependencies
      run: |
        pip install --no-cache-dir --use-pep517 --prefer-binary -r DesktopApp/requirements.txt pyinstaller
    
    - name: Create default config and .env
      env:
        MONGO_URI: ${{ secrets.MONGO_URI }}
        DB_NAME: ${{ secrets.DB_NAME }}
        COLLECTION: ${{ secrets.COLLECTION }}
        GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
      run: |
        $mongo = if ($env:MONGO_URI) { $env:MONGO_URI } else { "mongodb+srv://mlbenchpvtltd:HDqDr62jK1vK50x9@cluster0.pdhd1qx.mongodb.net/Test" }
        $db = if ($env:DB_NAME) { $env:DB_NAME } else { "Test" }
        $coll = if ($env:COLLECTION) { $env:COLLECTION } else { "Book Data" }
        $gkey = if ($env:GOOGLE_BOOKS_API_KEY) { $env:GOOGLE_BOOKS_API_KEY } else { "AIzaSyCbMpGA8FnOH2idwhsQ_UtDQ7BeqMEtB-0" }

        Set-Content -Path "DesktopApp/sync_config.json" -Value "{`"mongo_uri`":`"$mongo`",`"db_name`":`"$db`",`"collection`":`"$coll`",`"watch_mode`":false,`"interval`":30}"
        
        "MONGO_URI=$mongo" | Out-File -Encoding ascii DesktopApp/.env
        "DB_NAME=$db" | Out-File -Encoding ascii -Append DesktopApp/.env
        "COLLECTION=$coll" | Out-File -Encoding ascii -Append DesktopApp/.env
        "GOOGLE_BOOKS_API_KEY=$gkey" | Out-File -Encoding ascii -Append DesktopApp/.env
        "VISION_MODEL=minicpm-v:latest" | Out-File -Encoding ascii -Append DesktopApp/.env
        "TEXT_MODEL=llama3.2:1b" | Out-File -Encoding ascii -Append DesktopApp/.env
    
    - name: Build EXE
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "BookSync" `
        --add-data "DesktopApp/icons;icons" `
        --add-data "DesktopApp/frontend/icons;frontend/icons" `
        --add-data "DesktopApp/olive_high.json;." `
        --add-data "DesktopApp/sync_config.json;." `
        --add-data "DesktopApp/.env;." `
        --add-data "DesktopApp/backend;backend" `
        --add-data "DesktopApp/frontend;frontend" `
        --collect-all magic-pdf `
        --collect-all easyocr `
        --collect-all doclayout-yolo `
        --collect-all ultralytics `
        --collect-all torch `
        --collect-all torchvision `
        --collect-all shapely `
        --collect-all pyclipper `
        --collect-all lmdb `
        --collect-all imgaug `
        --collect-all skimage `
        --collect-all numpy `
        --collect-all transformers `
        --collect-all timm `
        --collect-all safetensors `
        --collect-all tokenizers `
        --collect-all huggingface_hub `
        --collect-all regex `
        --collect-all pymongo `
        --collect-all bson `
        --collect-all certifi `
        --collect-all dns `
        --collect-all customtkinter `
        --collect-all CTkMessagebox `
        --collect-all cryptography `
        --collect-all thefuzz `
        --collect-all loguru `
        --collect-all pydantic `
        --collect-all ollama `
        --collect-all cv2 `
        --collect-all PIL `
        --collect-all dotenv `
        --collect-all tqdm `
        --hidden-import=numpy `
        --hidden-import=yaml `
        --hidden-import=easyocr.easyocr `
        --hidden-import=skimage.morphology `
        --hidden-import=skimage.filters `
        --hidden-import=torchvision.transforms `
        --hidden-import=dns `
        --hidden-import=dns.resolver `
        --hidden-import=dns.rdatatype `
        --hidden-import=cryptography `
        --hidden-import=cryptography.hazmat.primitives.ciphers.aead `
        --hidden-import=bson `
        --hidden-import=bson.objectid `
        --hidden-import=dotenv `
        --hidden-import=PIL.Image `
        --hidden-import=PIL.ImageTk `
        --hidden-import=cv2 `
        --hidden-import=ollama `
        --hidden-import=tqdm `
        --hidden-import=backend.crypto_utils `
        --hidden-import=backend.db_connector `
        --hidden-import=backend.book_grouper `
        --hidden-import=backend.column_cropper `
        --hidden-import=backend.error_handler `
        --hidden-import=backend.main_mineru_ocr `
        --hidden-import=backend.model_manager `
        --hidden-import=backend.train_slides_logic `
        --hidden-import=backend.dinov2_model `
        --hidden-import=frontend.sync_app_ui `
        --hidden-import=frontend.interactive_cropper `
        --hidden-import=frontend.isbn_extractor_ui `
        --hidden-import=frontend.train_slides_ui `
        --hidden-import=models.dinov2_model `
        --hidden-import=models.generate_embeddings `
        --hidden-import=models.train_phase5 `
        DesktopApp/main.py
    
    - name: Compress Build with 7-Zip (Ultra)
      run: |
        7z a -mx=3 -mmt=on BookSync-Windows-Portable.zip ./dist/BookSync/*
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BookSync-Windows-Portable
        path: BookSync-Windows-Portable.zip
        retention-days: 3
